; Godot 4.3 Export Presets for CoreBound
; Generated for: com.yourname.corebound
; Replace "yourname" with your actual developer identifier before exporting.
;
; Before using these presets:
;   1. Install Godot 4.3 export templates (Editor → Manage Export Templates)
;   2. Configure Android SDK and JDK paths in Editor Settings → Export → Android
;   3. Create your release keystore and fill in the keystore/* fields below
;   4. For iOS: set application/bundle_identifier to match your Apple Developer App ID
;
; Build outputs go to the builds/ directory (create it if it does not exist):
;   mkdir -p builds

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/corebound.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

; Keystore paths — fill these in before building a release.
; Do NOT commit your .keystore file to version control.
; Use a CI secret or local override for automated builds.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user="corebound"
keystore/release_password=""

; Version — increment version/code by 1 for every upload to Google Play.
; version/code must be strictly ascending; Google Play rejects a lower or equal code.
version/code=1
version/name="1.0"

; Package identity
package/unique_name="com.yourname.corebound"
package/name="CoreBound"
package/signed=true
package/classify_as_game=true
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_as_launcher_app=false
package/show_in_app_library=true
package/meta_data=""
package/permissions=""

; Immersive mode hides the system navigation bar — required for a clean gaming experience.
screen/immersive_mode=true
screen/support_small=false
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; Sensor permissions — CoreBound uses none of these.
; Keeping them false minimises the permission footprint shown to users at install.
sensors/imu=false
sensors/light=false
sensors/magnetometer=false
sensors/microphone=false
sensors/proximity=false
sensors/uv=false

user_data_backup/allow=false
command_line/extra_args=""

; APK expansion — not needed; CoreBound assets are well under 100 MB.
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""

graphics/opengl_debug=false

; XR features — not used by CoreBound.
xr_features/xr_mode=0
xr_features/hand_tracking=0
xr_features/passthrough=0

; SDK versions — min 24 (Android 7.0) covers 97%+ of active devices.
; Target 34 is required by Google Play for apps submitted from August 2024 onward.
gradle_build/min_sdk=24
gradle_build/target_sdk=34

; Permissions — request only what is actually used.
; VIBRATE is needed for SettingsManager.trigger_haptic().
; All other network/storage permissions are intentionally disabled.
permissions/access_network_state=false
permissions/access_wifi_state=false
permissions/internet=false
permissions/vibrate=true
permissions/write_external_storage=false

; Orientation — CoreBound is landscape-only.
; Both flags together with landscape=true, portrait=false lock the orientation.
landscape_orientation=true
portrait_orientation=false

[preset.1]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/corebound.ipa"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""

; Bundle identifier — must match the App ID registered in the Apple Developer portal.
; Do not change this after the first App Store submission without creating a new app record.
application/bundle_identifier="com.yourname.corebound"

; application/signature is the Apple Team ID (10-character alphanumeric string).
; Found at: developer.apple.com/account → Membership → Team ID
application/signature=""

; short_version is the user-visible version string shown in the App Store.
; version is the internal build string — increment for every TestFlight/App Store upload.
application/short_version="1.0"
application/version="1.0.0"

; Icon interpolation: 4 = Lanczos (best quality for downscaling the 1024×1024 source icon)
application/icon_interpolation=4

; targeted_device_family:
;   1 = iPhone only
;   2 = iPad only
;   3 = iPhone + iPad (Universal)
; Start with 1 (iPhone) to reduce screenshot requirements for first submission.
; Switch to 3 later if you want to support iPad.
application/targeted_device_family=1

application/info=""

; Privacy usage descriptions — required by App Store if the app accesses camera,
; microphone, or photo library. CoreBound does not use any of these, so leave empty.
; Apple will reject the app if a permission is used without a description here.
application/privacy_camera_usage_description=""
application/privacy_microphone_usage_description=""
application/privacy_photolibrary_usage_description=""

; Capabilities — CoreBound needs neither Wi-Fi access nor push notifications.
capabilities/access_wifi=false
capabilities/push_notifications=false

; User data — CoreBound saves only to app-sandboxed storage (user://).
; The Files app and iTunes sharing integrations are not needed.
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false

; Orientation — landscape only.
; interface_orientation values: 0=landscape, 1=portrait, 2=landscape+portrait
landscape_orientation=true
portrait_orientation=false
interface_orientation=0
